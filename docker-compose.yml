services:
  backend:
    image: ${DOCKERHUB_USERNAME}/wondera-backend:latest
    container_name: wondera-backend
    restart: always
    env_file:
      - ./backend/.env
    ports:
      - "127.0.0.1:3000:3000"

  frontend:
    image: ${DOCKERHUB_USERNAME}/wondera-frontend:latest
    container_name: wondera-frontend
    restart: always
    ports:
      - "127.0.0.1:8080:80"